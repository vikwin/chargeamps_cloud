[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chargeamps-cloud"
version = "0.2.0"
description = "Asynchronous Python client for the Charge Amps Cloud API (eAPI v5)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "vikwin" }]
keywords = ["chargeamps", "ev", "charging", "home-assistant", "energy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
]
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
chargeamps = "chargeamps_cloud.cli:main"

[project.urls]
Homepage = "https://github.com/vikwin/chargeamps_cloud"
Repository = "https://github.com/vikwin/chargeamps_cloud"
Issues = "https://github.com/vikwin/chargeamps_cloud/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chargeamps_cloud"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
